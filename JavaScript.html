const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const TH_MONTHS_SHORT = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];

/* ===================== ฟังก์ชันช่วยทั่วไป ===================== */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fv(form, name) { const el = form.elements[name]; return el ? String(el.value || '').trim() : ''; }
function setText(id, t) { const el = document.getElementById(id); if (el) el.textContent = t; }
function money(n) { return (parseFloat(n) || 0).toLocaleString('th-TH'); }
function isCancelled(it) { return (it.appType || '').indexOf('ยกเลิก') !== -1; }
function pad2(n) { return String(n).padStart(2, '0'); }
function toIso(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayIso() { return toIso(new Date()); }

function parseIso(s) {
  if (!s) return null;
  if (s instanceof Date) return isNaN(s.getTime()) ? null : s;
  const str = String(s).trim();
  let m = str.match(/^(\d{4})[\/.-](\d{1,2})[\/.-](\d{1,2})/);
  if (m) {
    let y = +m[1];
    if (y > 2400) y -= 543;
    const d = new Date(y, +m[2] - 1, +m[3]);
    return isNaN(d.getTime()) ? null : d;
  }
  m = str.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  if (m) {
    let y = +m[3];
    if (y > 2400) y -= 543;
    const d = new Date(y, +m[2] - 1, +m[1]);
    return isNaN(d.getTime()) ? null : d;
  }
  const d = new Date(str);
  return isNaN(d.getTime()) ? null : d;
}

function calcExpireIso(issueIso) {
  const p = parseIso(issueIso);
  return p ? toIso(new Date(p.getFullYear() + 1, p.getMonth(), p.getDate() - 1)) : '';
}

function getExpDate(it) { return parseIso(it.expireDate) || parseIso(calcExpireIso(it.issueDate)); }
function formatThaiDate(s) { const d = parseIso(s); return !d ? '-' : d.getDate() + ' ' + TH_MONTHS[d.getMonth()] + ' ' + (d.getFullYear() + 543); }
function formatThaiShort(d) { return d.getDate() + ' ' + TH_MONTHS_SHORT[d.getMonth()] + ' ' + (d.getFullYear() + 543); }
function addrOf(it) { return `เลขที่ ${it.appNo || '-'} หมู่ ${it.appMoo || '-'} ต.${it.appSubdistrict || 'เชิงดอย'} อ.${it.appDistrict || 'ดอยสะเก็ด'} จ.${it.appProvince || 'เชียงใหม่'}`; }

const CLS_CANCEL = 'bg-rose-100 text-rose-800 font-bold dark:bg-rose-950/80 dark:text-rose-300';
const CLS_NORMAL = 'bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300';
const CLS_SOON = 'bg-amber-100 text-amber-900 font-bold dark:bg-amber-950/80 dark:text-amber-300';
const CLS_OVERDUE = 'bg-orange-100 text-orange-900 font-bold dark:bg-orange-950/80 dark:text-orange-300 border border-orange-300 dark:border-orange-800';
const CLS_EXPIRED = 'bg-rose-200 text-rose-950 font-extrabold dark:bg-rose-900 dark:text-rose-200 border border-rose-400 dark:border-rose-700';

function checkExpiration(it) {
  if (isCancelled(it)) return { status: 'cancel', text: 'ยกเลิกกิจการ', cls: CLS_CANCEL, expStr: '-', days: null };
  const exp = getExpDate(it);
  if (!exp) return { status: 'normal', text: 'ปกติ', cls: CLS_NORMAL, expStr: '-', days: null };
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((exp - today) / 86400000);
  const expStr = formatThaiShort(exp);
  if (days < 0) {
    if (it.category === 'cert-food') return { status: 'expired', text: 'เลยกำหนด', cls: CLS_OVERDUE, expStr, days };
    return { status: 'expired', text: 'หมดอายุ', cls: CLS_EXPIRED, expStr, days };
  }
  if (days <= 30) return { status: 'soon', text: 'ใกล้หมดอายุ', cls: CLS_SOON, expStr, days };
  return { status: 'normal', text: 'ปกติ', cls: CLS_NORMAL, expStr, days };
}

function daysText(c) {
  if (c.days == null) return '-';
  return c.days < 0 ? `เกิน ${-c.days} วัน` : `เหลือ ${c.days} วัน`;
}

function latestRecords(list) {
  const m = {};
  (list || []).forEach(it => {
    if (!it || !it.permanentId) return;
    const k = (it.category || 'cert-food') + '|' + String(it.permanentId).trim();
    if (!m[k] || Number(it.sheetRow || 0) > Number(m[k].sheetRow || 0)) {
      m[k] = it;
    }
  });
  return Object.keys(m).map(k => m[k]);
}

function historyOf(it) {
  return allData.filter(x => x.category === it.category && x.permanentId === it.permanentId).sort((a, b) => a.sheetRow - b.sheetRow);
}

function categoryOptions(allText, selected) {
  let html = '<option value="all"' + (selected === 'all' ? ' selected' : '') + '>' + allText + '</option>';
  Object.keys(CATEGORY_LABEL).forEach(k => { html += '<option value="' + k + '"' + (k === selected ? ' selected' : '') + '>' + esc(CATEGORY_LABEL[k]) + '</option>'; });
  return html;
}

function matchesKeyword(it, kw) {
  if (!kw) return true;
  kw = kw.toLowerCase();
  return ['appName', 'shopName', 'permanentId', 'licenseType', 'pubGoods', 'receiptNo', 'appPhone', 'shopArea', 'Area / Length']
    .some(k => String(it[k] || '').toLowerCase().includes(kw));
}

/* ===================== Toast / Modal / สิทธิ์ ===================== */
function showToast(title, msg) {
  const container = document.getElementById('toastContainer');
  if (!container) return;
  const el = document.createElement('div');
  el.className = 'bg-emerald-600 text-white px-5 py-3 rounded-2xl shadow-xl text-xs font-medium flex items-center gap-3 transition-all duration-300 pointer-events-auto';
  el.innerHTML = `<div><b>${esc(title)}</b><div class="text-[11px] opacity-90">${esc(msg)}</div></div>`;
  container.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function showModal(title, msg, type = 'warning', cb = null) {
  modalCallback = cb;
  setText('modalTitle', title);
  setText('modalMessage', msg);
  document.getElementById('customModal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('customModal').classList.add('hidden');
  if (modalCallback) { const cb = modalCallback; modalCallback = null; cb(); }
}

function openAdminAuth(action) {
  pendingActionInfo = action;
  const pwdInput = document.getElementById('adminPasswordInput');
  if (pwdInput) pwdInput.value = '';
  document.getElementById('adminAuthModal').classList.remove('hidden');
  if (pwdInput) setTimeout(() => pwdInput.focus(), 100);
}

function closeAdminAuthModal() {
  document.getElementById('adminAuthModal').classList.add('hidden');
  pendingActionInfo = null;
}

function requestAdminAccess() { openAdminAuth({ type: 'settings' }); }
function requestDeleteRecord(idx) { openAdminAuth({ type: 'delete', idx }); }
function requestCancelEstablishment(idx) { openAdminAuth({ type: 'cancel', idx }); }

function verifyAdminPassword() {
  const pwd = document.getElementById('adminPasswordInput').value;
  if (pwd !== getAdminPassword()) {
    showModal('รหัสผ่านไม่ถูกต้อง', 'กรุณาตรวจสอบรหัสผ่านผู้ดูแลระบบอีกครั้ง', 'error');
    return;
  }
  const action = pendingActionInfo;
  closeAdminAuthModal();
  if (!action) return;
  if (action.type === 'delete') executeDeleteRecord(action.idx);
  else if (action.type === 'cancel') executeCancelEstablishment(action.idx);
  else if (action.type === 'settings') switchMenu('admin-settings');
}

function failHandler(title) {
  return function (err) { showModal(title || 'ข้อผิดพลาด', (err && err.message) || String(err), 'error'); };
}

/* ===================== โหลดข้อมูล / เปลี่ยนเมนู ===================== */
function updateRenewBadge() {
  const n = latestRecords(allData).filter(it => { const s = checkExpiration(it).status; return s === 'expired' || s === 'soon'; }).length;
  setText('renewBadge', n);
}

function fetchData(onDone) {
  google.script.run
    .withSuccessHandler(function (data) {
      allData = Array.isArray(data) ? data : [];
      updateRenewBadge();
      if (typeof onDone === 'function') onDone();
    })
    .withFailureHandler(failHandler('โหลดข้อมูลไม่สำเร็จ'))
    .getEstablishmentsData();
}

function loadData() { fetchData(() => refreshView(false)); }
function reloadAndRestoreState() { fetchData(softRefresh); }

function switchMenu(menuId) {
  currentMenu = menuId;
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active-menu'));
  const active = document.getElementById('menu-' + menuId);
  if (active) active.classList.add('active-menu');
  setText('pageHeaderTitle', MENU_TITLES[menuId] || 'ระบบจัดการหนังสือรับรองการแจ้งและใบอนุญาตสาธารณสุข');
  refreshView(true);
}

function refreshView(force) {
  updateStats();
  if (!force && CATEGORY_LABEL[currentMenu]) {
    const f = document.getElementById('recordForm');
    if (f && f.dataset.category === currentMenu) return;
  }
  if (currentMenu === 'dashboard') renderDashboardView();
  else if (currentMenu === 'management') renderManagementView();
  else if (currentMenu === 'action-renew') renderRenewListView();
  else if (currentMenu === 'action-edit-cancel') renderEditCancelListView();
  else if (currentMenu === 'reports') renderReportsView();
  else if (currentMenu === 'admin-settings') renderAdminSettingsView();
  else if (CATEGORY_LABEL[currentMenu]) renderFormView(currentMenu);
}

function softRefresh() {
  updateStats();
  if (currentMenu === 'management') filterTableData();
  else if (currentMenu === 'action-renew') updateRenewTable();
  else if (currentMenu === 'action-edit-cancel') updateEditCancelTable();
  else refreshView(false);
}

function updateStats() {
  let rows = allData;
  if (CATEGORY_LABEL[currentMenu] !== undefined) rows = rows.filter(x => x.category === currentMenu);
  const latestList = latestRecords(rows);
  setText('statCatTotal', latestList.length.toLocaleString() + ' รายการ');
  setText('statCatNew', latestList.filter(x => x.appType === 'รายใหม่').length.toLocaleString() + ' รายการ');
  setText('statCatRenew', latestList.filter(it => checkExpiration(it).status === 'expired').length.toLocaleString() + ' รายการ');
  setText('statCatCancel', latestList.filter(it => checkExpiration(it).status === 'soon').length.toLocaleString() + ' รายการ');
  setText('statFee', money(rows.reduce((s, x) => s + (parseFloat(x.fee) || 0), 0)) + ' บาท');
}

function initDashboardCharts() {
  if (typeof Chart === 'undefined') return;
  const isDark = document.documentElement.classList.contains('dark');
  const textColor = isDark ? '#cbd5e1' : '#0f172a';
  const gridColor = isDark ? '#334155' : '#e2e8f0';

  const catCounts = {};
  const latest = latestRecords(allData);
  latest.forEach(it => {
    const name = CATEGORY_LABEL[it.category] || it.category || 'อื่นๆ';
    catCounts[name] = (catCounts[name] || 0) + 1;
  });

  const labels = Object.keys(catCounts);
  const dataValues = Object.values(catCounts);
  if (labels.length === 0) {
    labels.push('ยังไม่มีข้อมูล');
    dataValues.push(1);
  }

  if (window.myCategoryChart instanceof Chart) {
    window.myCategoryChart.destroy();
  }

  const catCtx = document.getElementById('categoryChart');
  if (catCtx) {
    window.myCategoryChart = new Chart(catCtx, {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{
          data: dataValues,
          backgroundColor: labels.length === 1 && labels[0] === 'ยังไม่มีข้อมูล' ? ['#cbd5e1'] : ['#38bdf8', '#c084fc', '#facc15', '#fb7185', '#22d3ee', '#f472b6', '#4ade80'],
          borderWidth: 3,
          borderColor: isDark ? '#0f172a' : '#ffffff'
        }]
      },
      options: { 
        responsive: true, 
        maintainAspectRatio: false, 
        plugins: { 
          legend: { 
            position: 'bottom', 
            labels: { 
              boxWidth: 14, 
              color: textColor,
              font: { size: 12, family: 'Sarabun', weight: '700' },
              generateLabels: function(chart) {
                const data = chart.data;
                if (data.labels.length && data.datasets.length) {
                  return data.labels.map((label, i) => {
                    let shortName = label;
                    if (shortName.length > 25) shortName = shortName.substring(0, 25) + '...';
                    return {
                      text: labels.length === 1 && labels[0] === 'ยังไม่มีข้อมูล' ? 'ยังไม่มีข้อมูลในระบบ' : `${shortName} (${data.datasets[0].data[i]} ราย)`,
                      fillStyle: data.datasets[0].backgroundColor[i] || '#cbd5e1',
                      strokeStyle: isDark ? '#0f172a' : '#ffffff',
                      lineWidth: 2,
                      hidden: false,
                      index: i
                    };
                  });
                }
                return [];
              }
            } 
          },
          tooltip: {
            callbacks: {
              label: function(context) {
                if (labels.length === 1 && labels[0] === 'ยังไม่มีข้อมูล') return ' ไม่มีข้อมูลในระบบ';
                let label = context.label || '';
                let value = context.raw || 0;
                return ` ${label}: ${value} รายการ`;
              }
            }
          }
        } 
      }
    });
  }

  const monthlyFees = new Array(12).fill(0);
  allData.forEach(it => {
    if (it.issueDate) {
      const d = parseIso(it.issueDate);
      if (d) {
        const m = d.getMonth();
        monthlyFees[m] += parseFloat(it.fee) || 0;
      }
    }
  });

  if (window.myFeeChart instanceof Chart) {
    window.myFeeChart.destroy();
  }

  const feeCtx = document.getElementById('feeChart');
  if (feeCtx) {
    window.myFeeChart = new Chart(feeCtx, {
      type: 'bar',
      data: {
        labels: TH_MONTHS_SHORT,
        datasets: [{
          label: 'ยอดจัดเก็บ (บาท)',
          data: monthlyFees,
          backgroundColor: '#34d399',
          borderRadius: 8
        }]
      },
      options: { 
        responsive: true, 
        maintainAspectRatio: false, 
        plugins: { 
          legend: { display: false },
          tooltip: {
            callbacks: {
              label: function(context) {
                return ` ยอดจัดเก็บ: ${money(context.raw)} บาท`;
              }
            }
          }
        }, 
        scales: { 
          x: { ticks: { color: textColor, font: { family: 'Sarabun', weight: '700' } }, grid: { color: gridColor } },
          y: { beginAtZero: true, ticks: { color: textColor, font: { family: 'Sarabun', weight: '700' } }, grid: { color: gridColor } } 
        } 
      }
    });
  }
}

function toggleDetailRow(key) {

  if (!el) return;
  const open = el.classList.contains('open');
  document.querySelectorAll('.accordion-content').forEach(x => x.classList.remove('open'));
  document.querySelectorAll('[id^="btn_row_detail_"]').forEach(b => b.textContent = '🔍');

function openEditModal(idx) {
  const it = allData[idx];
  const form = document.getElementById('editForm');
  if (!it || !form) return;

  form.elements['category'].value = it.category;
  form.elements['sheetRow'].value = it.sheetRow;
  form.elements['sheetName'].value = it.sheetName;

  const fields = EDIT_FIELDS_COMMON.concat(EDIT_FIELDS_EXTRA[it.category] || []).concat([['remark', 'หมายเหตุ', 'textarea']]);
  let html = '<div class="grid grid-cols-1 md:grid-cols-2 gap-4">';
  fields.forEach(f => {
    const name = f[0], label = f[1], type = f[2] || 'text';
    const v = it[name] == null ? '' : String(it[name]);
    const nameAttr = `name="${esc(name)}"`;
    let input = '';
    if (type === 'select') {
      const opts = APP_TYPES.indexOf(v) === -1 && v ? [v].concat(APP_TYPES) : APP_TYPES;
      input = `<select ${nameAttr} class="inp">${opts.map(o => `<option value="${esc(o)}"${o === v ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`;
    } else if (type === 'zone') {
      const zones = PUBLIC_ZONES.indexOf(v) === -1 && v ? [v].concat(PUBLIC_ZONES) : PUBLIC_ZONES;
      input = `<select ${nameAttr} class="inp">${zones.map(z => `<option value="${esc(z)}"${z === v ? ' selected' : ''}>${esc(z)}</option>`).join('')}</select>`;
    } else if (type === 'textarea') {
      input = `<textarea ${nameAttr} rows="3" class="inp">${esc(v)}</textarea>`;
    } else if (type === 'date') {
      const dv = parseIso(v) ? toIso(parseIso(v)) : '';
      const extra = name === 'issueDate' ? ' onchange="onEditIssueDateChange(this.value)"' : '';
      input = `<input type="date" ${nameAttr} value="${esc(dv)}" class="inp"${extra}>`;
    } else if (type === 'number') {
      input = `<input type="number" step="0.01" ${nameAttr} value="${esc(v)}" class="inp">`;
    } else {
      input = `<input ${nameAttr} value="${esc(v)}" class="inp">`;
    }
    const wide = (type === 'textarea' || type === 'zone') ? ' md:col-span-2' : '';
    html += `<div class="${wide.trim()}"><label class="lbl">${esc(label)}</label>${input}</div>`;
  });
  html += '</div><p class="text-xs text-slate-500 dark:text-slate-400">💡 เมื่อเปลี่ยนวันที่อนุญาต ระบบจะคำนวณวันหมดอายุใหม่ให้อัตโนมัติ (แก้ไขเองได้)</p>';

  document.getElementById('editFormBody').innerHTML = html;
  setText('editModalTitle', 'แก้ไขข้อมูล: ' + (it.shopName || '-') + ' (' + it.permanentId + ')');
  document.getElementById('editModal').classList.remove('hidden');
}

function onEditIssueDateChange(v) {
  const form = document.getElementById('editForm');
  if (form && form.elements['expireDate']) form.elements['expireDate'].value = calcExpireIso(v);
}

function closeEditModal() {
  const m = document.getElementById('editModal');
  if (m) m.classList.add('hidden');
}

function handleEditSubmit(e) {
  e.preventDefault();
  const form = e.target;
  const sheetRow = parseInt(fv(form, 'sheetRow'), 10);
  const sheetName = fv(form, 'sheetName');
  const category = fv(form, 'category');
  const original = allData.find(x => x.category === category && Number(x.sheetRow) === sheetRow && x.sheetName === sheetName);
  if (!original) { closeEditModal(); showModal('ข้อผิดพลาด', 'ไม่พบข้อมูลต้นฉบับ กรุณารีเฟรชหน้าจอ', 'error'); return; }

  const data = Object.assign({}, original, { isNewRecord: false });
  Array.prototype.forEach.call(form.elements, function (el) {
    if (!el.name || ['category', 'sheetRow', 'sheetName'].indexOf(el.name) !== -1) return;
    data[el.name] = String(el.value || '').trim();
  });
  if (!data.appName || !data.shopName) { showModal('ข้อมูลไม่ครบ', 'กรุณากรอกชื่อผู้ยื่นคำขอและชื่อสถานประกอบการ', 'warning'); return; }
  if (!data.expireDate && data.issueDate) data.expireDate = calcExpireIso(data.issueDate);

  closeEditModal();
  const backup = Object.assign({}, original);
  Object.assign(original, data);
  softRefresh();
  showToast('กำลังบันทึก', 'กำลังอัปเดตข้อมูล...');

  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success) {
        showToast('สำเร็จ', 'อัปเดตข้อมูลเรียบร้อยแล้ว');
      } else {
        Object.assign(original, backup);
        showModal('บันทึกไม่สำเร็จ', (res && res.message) || 'ไม่สามารถบันทึกลง Google Sheet ได้', 'error');
      }
      reloadAndRestoreState();
    })
    .withFailureHandler(function (err) {
      Object.assign(original, backup);
      reloadAndRestoreState();
      showModal('บันทึกไม่สำเร็จ', (err && err.message) || String(err), 'error');
    })
    .saveEstablishmentData(data);
}

function executeDeleteRecord(idx) {
  const it = allData[idx];
  if (!it) return;
  showToast('กำลังลบ', 'กำลังลบข้อมูลออกจากระบบ...');
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success) { showToast('สำเร็จ', 'ลบข้อมูลเรียบร้อยแล้ว'); reloadAndRestoreState(); }
      else showModal('ข้อผิดพลาด', (res && res.message) || 'ไม่สามารถลบข้อมูลได้', 'error');
    })
    .withFailureHandler(failHandler())
    .deleteEstablishmentData({ category: it.category, sheetRow: it.sheetRow, sheetName: it.sheetName, permanentId: it.permanentId });
}

function checkDuplicateApplicant(val) {
  const box = document.getElementById('duplicateAlertBox');
  const txt = document.getElementById('duplicateAlertText');
  if (!box || !txt) return;
  const q = String(val || '').trim().toLowerCase();
  if (q.length < 3) { box.classList.add('hidden'); return; }
  const found = latestRecords(allData).find(x => String(x.appName || '').toLowerCase().includes(q));
  if (found) {
    txt.textContent = `⚠️ คำเตือน: พบชื่อ "${found.appName}" มีอยู่แล้วในระบบ (รหัส: ${found.permanentId}, ร้าน: ${found.shopName})`;
    box.classList.remove('hidden');
  } else {
    box.classList.add('hidden');
  }
}

function onApplicantTypeChange() {
  const isCorp = document.getElementById('applicantTypeSelect').value === 'นิติบุคคล';
  document.getElementById('boxPersonName').classList.toggle('hidden', isCorp);
  document.getElementById('boxCorpName').classList.toggle('hidden', !isCorp);
  document.getElementById('boxCorpBy').classList.toggle('hidden', !isCorp);
  document.getElementById('inputPersonName').required = !isCorp;
  document.getElementById('inputCorpName').required = isCorp;
  document.getElementById('inputCorpBy').required = isCorp;
}

function initHealthDropdowns() {
  const gSel = document.getElementById('hGroup');
  if (!gSel) return;
  gSel.innerHTML = '<option value="">-- เลือกกลุ่มกิจการ --</option>' + getDangerousGroups().map(g => `<option value="${esc(g.group)}">${esc(g.group)}</option>`).join('');
  onHGroupChange();
}

function healthPath() {
  const gName = document.getElementById('hGroup').value;
  const tName = document.getElementById('hType').value;
  const subName = document.getElementById('hSub').value;
  const chName = document.getElementById('hChild').value;
  const group = getDangerousGroups().find(g => g.group === gName) || { types: [] };
  const typeObj = (group.types || []).find(t => t.type === tName) || { subItems: [] };
  const subObj = (typeObj.subItems || []).find(s => (typeof s === 'string' ? s : s.name) === subName) || { children: [] };
  const chObj = (subObj.children || []).find(c => (typeof c === 'string' ? c : c.name) === chName) || { details: [] };
  return { group, typeObj, subObj, chObj };
}

function fillSelect(id, placeholder, items) {
  const el = document.getElementById(id);
  el.innerHTML = `<option value="">${placeholder}</option>` + items.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
}

function onHGroupChange() {
  const p = healthPath();
  fillSelect('hType', '-- เลือกประเภทกิจการ --', (p.group.types || []).map(t => t.type));
  onHTypeChange();
}

function onHTypeChange() {
  const p = healthPath();

function handleFormSubmit(e, category) {
  e.preventDefault();
  const form = e.target;
  const appTypeVal = fv(form, 'applicantType');

  let finalAppName = fv(form, 'appName');
  if (appTypeVal === 'นิติบุคคล') {
    const corp = fv(form, 'corpName');
    const by = fv(form, 'corpBy');
    finalAppName = corp + (by ? ' โดย ' + by : '');
  }
  if (!finalAppName) { showModal('ข้อมูลไม่ครบ', 'กรุณากรอกชื่อผู้ยื่นคำขอ', 'warning'); return; }

  const data = {
    category: category,
    applicantType: appTypeVal,
    appName: finalAppName,
    appNo: fv(form, 'appNo'), appSoi: fv(form, 'appSoi'), appRoad: fv(form, 'appRoad'), appMoo: fv(form, 'appMoo'),
    appSubdistrict: fv(form, 'appSubdistrict'), appDistrict: fv(form, 'appDistrict') || 'ดอยสะเก็ด',
    appProvince: fv(form, 'appProvince') || 'เชียงใหม่', appPhone: fv(form, 'appPhone'),
    shopName: fv(form, 'shopName'),
    licenseType: fv(form, 'licenseType'),
    shopArea: parseFloat(fv(form, 'shopArea')) || 0,
    fee: parseFloat(fv(form, 'fee')) || 0,
    shopNo: fv(form, 'shopNo'), shopSoi: fv(form, 'shopSoi'), shopRoad: fv(form, 'shopRoad'), shopMoo: fv(form, 'shopMoo'),
    shopSubdistrict: fv(form, 'shopSubdistrict'), shopDistrict: fv(form, 'shopDistrict') || 'ดอยสะเก็ด',
    shopProvince: fv(form, 'shopProvince') || 'เชียงใหม่', shopPhone: fv(form, 'shopPhone'),
    receiptNo: fv(form, 'receiptNo'),
    issueDate: fv(form, 'issueDate'),
    expireDate: '',
    appType: fv(form, 'appType') || 'รายใหม่',
    remark: fv(form, 'remark'),
    isNewRecord: true
  };

  if (category === 'lic-market') {
    data.marketStalls = parseInt(fv(form, 'marketStalls'), 10) || 0;
    delete data.shopArea;
  } else if (category === 'lic-health') {
    data.healthGroup = document.getElementById('hGroup').value;
    data.healthType = document.getElementById('hType').value;
    data.healthSub = document.getElementById('hSub').value;
    data.healthChild = document.getElementById('hChild').value;
    data.healthDetail = document.getElementById('hDetail').value;
    data.licenseType = 'กิจการที่เป็นอันตรายต่อสุขภาพ';
  } else if (category === 'lic-public') {
    data.pubGoods = fv(form, 'pubGoods');
    data.pubAssistants = parseInt(fv(form, 'pubAssistants'), 10) || 0;
    data.licenseType = fv(form, 'pubSubtype');
    data.shopArea = fv(form, 'shopArea');
    data['Area / Length'] = parseFloat(fv(form, 'shopAreaSize')) || 0;
    if (!data.shopArea) { showModal('ข้อมูลไม่ครบ', 'กรุณาเลือกเขตผ่อนผัน / ที่ตั้งการจำหน่ายสินค้า', 'warning'); return; }
  } else if (category === 'lic-trash') {
    data.trashType = document.getElementById('trashType').value;
    data.trashSubtype = document.getElementById('trashSubtype').value;
    data.licenseType = data.trashSubtype + ' (' + data.trashType + ')';
  }

  const btn = document.getElementById('recordSubmitBtn');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ กำลังบันทึก...'; }
  const resetBtn = () => { if (btn) { btn.disabled = false; btn.textContent = '💾 บันทึกข้อมูลเข้าสู่ระบบ'; } };

  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success) {
        showToast('สำเร็จ', 'บันทึกข้อมูลเรียบร้อยแล้ว รหัส ' + res.permanentId);
        mgmtState = { cat: category, kw: res.permanentId, openId: '' };
        currentMenu = 'management';
        switchMenu('management');
        loadData();
      } else {
        resetBtn();
        showModal('ข้อผิดพลาด', (res && res.message) || 'บันทึกไม่สำเร็จ', 'error');
      }
    })
    .withFailureHandler(function (err) { resetBtn(); failHandler()(err); })
    .saveEstablishmentData(data);
}

function getRenewList() {
  let list = latestRecords(allData).filter(it => !isCancelled(it));
  const hasRange = renewState.start || renewState.end;
  if (hasRange) {
    list = list.filter(it => {
      const exp = getExpDate(it);
      if (!exp) return false;
      const s = toIso(exp);
      if (renewState.start && s < renewState.start) return false;
      if (renewState.end && s > renewState.end) return false;
      return true;
    });
  } else {
    list = list.filter(it => { const s = checkExpiration(it).status; return s === 'expired' || s === 'soon'; });
  }
  if (renewState.cat !== 'all') list = list.filter(it => it.category === renewState.cat);
  if (renewState.kw) list = list.filter(it => matchesKeyword(it, renewState.kw));
  return list.sort((a, b) => (getExpDate(a) || 0) - (getExpDate(b) || 0));
}

function onRenewFilterChange() {
  const start = document.getElementById('renewStartDate').value;
  const end = document.getElementById('renewEndDate').value;
  if (start && end && start > end) {
    showModal('ช่วงวันที่ไม่ถูกต้อง', 'วันที่เริ่มต้นต้องไม่มากกว่าวันที่สิ้นสุด', 'warning');
    document.getElementById('renewStartDate').value = renewState.start;
    document.getElementById('renewEndDate').value = renewState.end;
    return;
  }
  renewState.cat = document.getElementById('renewCatFilter').value;
  renewState.kw = document.getElementById('renewSearchInput').value.trim();
  renewState.start = start;
  renewState.end = end;
  updateRenewTable();
}

function setRenewQuickRange(type) {
  const t = new Date(); t.setHours(0, 0, 0, 0);
  let s = null, e = null;
  if (type === 'month') { s = new Date(t.getFullYear(), t.getMonth(), 1); e = new Date(t.getFullYear(), t.getMonth() + 1, 0); }
  else if (type === 'next30') { s = t; e = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 30); }
  else if (type === 'next90') { s = t; e = new Date(t.getFullYear(), t.getMonth() + 3, t.getDate()); }
  else if (type === 'year') { s = new Date(t.getFullYear(), 0, 1); e = new Date(t.getFullYear(), 11, 31); }
  renewState.start = s ? toIso(s) : '';
  renewState.end = e ? toIso(e) : '';
  document.getElementById('renewStartDate').value = renewState.start;
  document.getElementById('renewEndDate').value = renewState.end;
  updateRenewTable();
}

function renewRangeText() {
  if (!renewState.start && !renewState.end) return 'แสดงรายการที่หมดอายุแล้วและจะหมดอายุภายใน 30 วัน (เลือกช่วงวันที่เพื่อดูล่วงหน้า)';
  return `แสดงสถานประกอบการที่มีวันหมดอายุตั้งแต่ ${renewState.start ? formatThaiDate(renewState.start) : '(ไม่กำหนด)'} ถึง ${renewState.end ? formatThaiDate(renewState.end) : '(ไม่กำหนด)'}`;
}

function updateRenewTable() {
  const tbody = document.getElementById('renewTableBody');
  if (!tbody) return;
  const list = getRenewList();
  setText('renewCount', list.length);
  setText('renewModeText', renewRangeText());

function exportRenewListExcel() {

  const org = getOrgSettings();
  const rows = [
    ['รายชื่อสถานประกอบการที่หมดอายุ / ใกล้หมดอายุ'],
    [org.orgSub],
    [renewRangeText().replace('แสดง', '') + ' | ข้อมูล ณ วันที่ ' + formatThaiDate(todayIso())],
    [],
    ['ลำดับ', 'รหัสถาวร', 'หมวดหมู่', 'ชื่อสถานประกอบการ', 'ประเภทใบอนุญาต', 'ชื่อผู้ยื่นคำขอ', 'เบอร์โทรศัพท์', 'ที่อยู่', 'วันที่อนุญาตล่าสุด', 'วันหมดอายุ', 'คงเหลือ (วัน) ติดลบ = เลยกำหนด', 'สถานะ', 'ค่าธรรมเนียมล่าสุด (บาท)']
  ];
  list.forEach((it, i) => {
    const c = checkExpiration(it);
    rows.push([i + 1, it.permanentId, CATEGORY_LABEL[it.category] || it.category, it.shopName, it.licenseType, it.appName, it.appPhone || '-', addrOf(it), formatThaiDate(it.issueDate), c.expStr, c.days == null ? '' : c.days, c.text, parseFloat(it.fee) || 0]);
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 6 }, { wch: 12 }, { wch: 40 }, { wch: 30 }, { wch: 40 }, { wch: 28 }, { wch: 14 }, { wch: 45 }, { wch: 18 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 14 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'รายการหมดอายุ');
  XLSX.writeFile(wb, `รายการหมดอายุ_${renewState.start || 'ไม่กำหนด'}_ถึง_${renewState.end || 'ไม่กำหนด'}.xlsx`);
  showToast('สำเร็จ', `ส่งออก Excel ${list.length} รายการเรียบร้อยแล้ว`);

function openRenewModal(idx) {
  const it = allData[idx];
  const form = document.getElementById('renewForm');
  if (!it || !form) return;
  form.elements['renewIndex'].value = idx;
  form.elements['receiptNo'].value = '';
  form.elements['fee'].value = it.fee || 0;
  form.elements['issueDate'].value = todayIso();
  if (form.elements['adminPassword']) form.elements['adminPassword'].value = '';
  setText('renewModalTitle', 'ต่ออายุใบอนุญาต: ' + it.shopName + ' (' + it.permanentId + ')');
  document.getElementById('renewModal').classList.remove('hidden');
}

function closeRenewModal() {
  const rm = document.getElementById('renewModal');
  if (rm) rm.classList.add('hidden');
}

function handleRenewSubmit(e) {
  e.preventDefault();
  const form = e.target;
  if (form.elements['adminPassword'] && fv(form, 'adminPassword') !== getAdminPassword()) {
    showModal('รหัสผ่านไม่ถูกต้อง', 'กรุณากรอกรหัสผ่านยืนยันเจ้าหน้าที่ให้ถูกต้อง', 'error');
    return;
  }
  const it = allData[parseInt(form.elements['renewIndex'].value, 10)];
  if (!it) { closeRenewModal(); return; }

  const data = Object.assign({}, it, {
    receiptNo: fv(form, 'receiptNo'),
    fee: parseFloat(fv(form, 'fee')) || 0,
    issueDate: fv(form, 'issueDate'),
    oldExpireDate: it.expireDate,
    expireDate: '',
    appType: 'ต่ออายุ',
    sheetRow: '',
    isNewRecord: true
  });

  closeRenewModal();
  showToast('กำลังบันทึก', 'กำลังบันทึกการชำระเงินและต่ออายุ...');
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.success) {
        showToast('สำเร็จ', 'ต่ออายุเรียบร้อย หมดอายุใหม่ ' + formatThaiDate(res.expireDate));
        reloadAndRestoreState();
      } else {
        showModal('ข้อผิดพลาด', (res && res.message) || 'ต่ออายุไม่สำเร็จ', 'error');
      }
    })
    .withFailureHandler(failHandler())
    .saveEstablishmentData(data);
}

function filterReportRows() {
  const year = document.getElementById('repYear') ? document.getElementById('repYear').value : 'all';
  const month = document.getElementById('repMonth') ? document.getElementById('repMonth').value : 'all';
  return allData.filter(it => {
    const d = parseIso(it.issueDate);
    if (!d) return false;
    if (year !== 'all' && String(d.getFullYear() + 543) !== String(year)) return false;
    if (month !== 'all' && String(d.getMonth() + 1) !== String(month)) return false;
    return true;
  });
}

function updateReportData() {
  const repType = document.getElementById('reportTypeSelect').value;
  const year = document.getElementById('repYear').value;
  const month = document.getElementById('repMonth').value;
  let subText = 'ข้อมูลสะสมทั้งหมดทุกช่วงเวลา';
  if (year !== 'all' && month !== 'all') subText = `ประจำปี พ.ศ. ${year} เดือน ${TH_MONTHS[month - 1]}`;
  else if (year !== 'all') subText = `ประจำปี พ.ศ. ${year}`;
  else if (month !== 'all') subText = `ประจำเดือน ${TH_MONTHS[month - 1]}`;
  setText('reportSubTitle', subText);

  const container = document.getElementById('reportContentContainer');
  if (!container) return;
  const filtered = filterReportRows();
  if (repType === 'official') { setText('reportMainTitle', 'รายงานการออกใบอนุญาตและหนังสือรับรองการแจ้ง (สถิติทางการ)'); renderOfficialReportTable(filtered, container); }
  else if (repType === 'fee') { setText('reportMainTitle', 'รายงานสรุปการจัดเก็บค่าธรรมเนียมใบอนุญาต'); renderFeeReportTable(filtered, container); }
  else { setText('reportMainTitle', 'รายงานทะเบียนสถานประกอบการทั้งหมดในระบบ'); renderDetailReportTable(filtered, container); }
}

function renderOfficialReportTable(filtered, container) {
  const byCat = cat => filtered.filter(x => x.category === cat);
  const getSubStats = (list, m1, m2) => {
    const active = latestRecords(list);
    const oldList = active.filter(x => x.appType === 'รายเดิม' || x.appType === 'ต่ออายุ');
    const newList = active.filter(x => x.appType === 'รายใหม่');
    const cnt = (l, m) => l.filter(x => String(x.licenseType).includes(m)).length;
    return { total: active.length, oldTotal: oldList.length, newTotal: newList.length, sub1Old: cnt(oldList, m1), sub2Old: cnt(oldList, m2), sub1New: cnt(newList, m1), sub2New: cnt(newList, m2) };
  };
  const s1 = getSubStats(byCat('cert-food'), 'จำหน่ายอาหาร', 'สะสมอาหาร');
  const others = [
    ['2', 'ใบอนุญาต การจำหน่ายอาหารหรือสะสมอาหาร (พื้นที่เกิน 200 ตารางเมตรขึ้นไป)', getSubStats(byCat('lic-food'), 'จำหน่ายอาหาร', 'สะสมอาหาร')],
    ['3', 'ใบอนุญาตประกอบกิจการที่เป็นอันตรายต่อสุขภาพ', getSubStats(byCat('lic-health'), 'กิจการ', 'สุขภาพ')],
    ['4', 'ใบอนุญาต การจัดตั้งตลาด', getSubStats(byCat('lic-market'), 'ประเภทที่ 1', 'ประเภทที่ 2')],
    ['5', 'ใบอนุญาต การจำหน่ายสินค้าในที่หรือทางสาธารณะ', getSubStats(byCat('lic-public'), 'จัดวางปกติ', 'เร่ขาย')],
    ['6', 'ใบอนุญาต การเก็บ ขน หรือกำจัดสิ่งปฏิกูลหรือมูลฝอย', getSubStats(byCat('lic-trash'), 'เก็บและขน', 'กำจัดมูลฝอย')]
  ];
  const head = (no, label, total) => `<tr class="bg-slate-50/80 dark:bg-slate-800/60 font-bold"><td class="py-3 px-4 text-center">${no}</td><td class="py-3 px-4">${label}</td><td class="py-3 px-4 text-right text-emerald-700 dark:text-emerald-400 font-extrabold">${total}</td></tr>`;
  const sub = (label, val, indent) => `<tr><td class="py-2.5 px-4"></td><td class="py-2.5 px-4 ${indent} text-slate-600 dark:text-slate-400">${label}</td><td class="py-2.5 px-4 text-right font-semibold">${val}</td></tr>`;

  let body = head('1', 'หนังสือรับรองการแจ้ง การจัดตั้งสถานที่จำหน่ายอาหารหรือสถานที่สะสมอาหาร (พื้นที่ไม่เกิน 200 ตร.ม.)', s1.total)
    + sub('1.1 รายเดิม (ชำระค่าธรรมเนียมรายปี)', s1.oldTotal, 'pl-8')
    + sub('1.1.1 สถานที่จำหน่ายอาหาร', s1.sub1Old, 'pl-12')
    + sub('1.1.2 สถานที่สะสมอาหาร', s1.sub2Old, 'pl-12')
    + sub('1.2 รายใหม่', s1.newTotal, 'pl-8')
    + sub('1.2.1 สถานที่จำหน่ายอาหาร', s1.sub1New, 'pl-12')
    + sub('1.2.2 สถานที่สะสมอาหาร', s1.sub2New, 'pl-12');
  others.forEach(o => {
    body += head(o[0], o[1], o[2].total) + sub(o[0] + '.1 รายเดิม (ต่ออายุ)', o[2].oldTotal, 'pl-8') + sub(o[0] + '.2 รายใหม่', o[2].newTotal, 'pl-8');
  });

  container.innerHTML = `<table class="w-full text-left text-xs">
    <thead class="bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 uppercase tracking-wider font-bold">
      <tr><th class="py-3.5 px-4 w-16 text-center">ลำดับ</th><th class="py-3.5 px-4">ประเภทใบอนุญาต / หนังสือรับรองการแจ้ง</th><th class="py-3.5 px-4 w-32 text-right">จำนวน (ราย)</th></tr>
    </thead>
    <tbody class="divide-y divide-slate-100 dark:divide-slate-800">${body}</tbody></table>`;
}

function monthlyFeeSummary(filtered) {
  const fees = new Array(12).fill(0), counts = new Array(12).fill(0);
  filtered.forEach(it => { const d = parseIso(it.issueDate); if (d) { fees[d.getMonth()] += parseFloat(it.fee) || 0; counts[d.getMonth()] += 1; } });
  return { fees, counts };
}

function normalizeDateValue(v) {
  if (v === null || v === undefined || v === '') return '';
  if (typeof v === 'number') {
    const d = new Date(Math.round((v - 25569) * 86400000));
    return toIso(new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) { let y = +m[1]; if (y > 2400) y -= 543; return y + '-' + pad2(m[2]) + '-' + pad2(m[3]); }
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})$/);
  if (m) { let y = +m[3]; if (y > 2400) y -= 543; return y + '-' + pad2(m[2]) + '-' + pad2(m[1]); }
  return '';
}

function resolveCategory(v) {
  const s = String(v || '').trim();
  if (CATEGORY_LABEL[s]) return s;
  const k = Object.keys(CATEGORY_LABEL).find(key => CATEGORY_LABEL[key] === s);
  if (k) return k;
  if (/ตลาด/.test(s)) return 'lic-market';
  if (/อันตราย/.test(s)) return 'lic-health';
  if (/สาธารณะ/.test(s)) return 'lic-public';
  if (/ปฏิกูล|มูลฝอย/.test(s)) return 'lic-trash';
  if (/เกิน\s*200/.test(s)) return 'lic-food';
  return 'cert-food';
}

function pick(r, keys) {
  for (let i = 0; i < keys.length; i++) {
    const v = r[keys[i]];
    if (v !== undefined && v !== null && String(v).trim() !== '') return v;
  }
  return '';
}

function handleBulkImportExcel(e) {
  const input = e.target;
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function (evt) {
    try {
      const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
      const json = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '', raw: true });
      if (!json.length) throw new Error('ไม่พบข้อมูลในไฟล์ Excel');

      const rowsToImport = [];
      let skipped = 0;
      json.forEach(r => {
        const appName = String(pick(r, ['ชื่อผู้ยื่นคำขอ', 'appName'])).trim();
        const shopName = String(pick(r, ['ชื่อสถานประกอบการ', 'shopName'])).trim();
        if (!appName && !shopName) { skipped++; return; }
        const category = resolveCategory(pick(r, ['หมวดหมู่', 'category']));
        const issueDate = normalizeDateValue(pick(r, ['วันที่อนุญาต', 'issueDate'])) || todayIso();
        const row = {
          category: category,
          permanentId: String(pick(r, ['รหัสถาวร', 'permanentId'])).trim(),
          appName: appName || '-',
          shopName: shopName || '-',
          licenseType: String(pick(r, ['ประเภทใบอนุญาต', 'licenseType']) || CATEGORY_LABEL[category]),
          appPhone: String(pick(r, ['เบอร์โทรศัพท์', 'appPhone'])),
          appNo: String(pick(r, ['เลขที่', 'appNo'])),
          appMoo: String(pick(r, ['หมู่ที่', 'appMoo'])),
          appSubdistrict: 'เชิงดอย', appDistrict: 'ดอยสะเก็ด', appProvince: 'เชียงใหม่',
          fee: parseFloat(pick(r, ['ค่าธรรมเนียม', 'fee'])) || 0,
          receiptNo: String(pick(r, ['เลขที่ใบเสร็จ', 'receiptNo'])),
          issueDate: issueDate,
          expireDate: normalizeDateValue(pick(r, ['วันหมดอายุ', 'expireDate'])),
          appType: String(pick(r, ['สถานะคำขอ', 'appType']) || 'รายเดิม'),
          remark: String(pick(r, ['หมายเหตุ', 'remark']))
        };
        const area = pick(r, ['พื้นที่', 'พื้นที่/แผง', 'shopArea']);
        if (category === 'lic-market') row.marketStalls = parseInt(area, 10) || 0;
        else row.shopArea = category === 'lic-public' ? String(area) : (parseFloat(area) || 0);
        rowsToImport.push(row);
      });

      if (!rowsToImport.length) throw new Error('ไม่พบแถวที่มีชื่อผู้ยื่นคำขอหรือชื่อสถานประกอบการ');
      showToast('กำลังนำเข้า', `กำลังบันทึก ${rowsToImport.length} รายการ${skipped ? ` (ข้ามแถวว่าง ${skipped})` : ''}...`);

      google.script.run
        .withSuccessHandler(function (res) {
          if (res && res.success) {
            showModal('นำเข้าสำเร็จ', `นำเข้าข้อมูลเรียบร้อย ${res.count} รายการ`, 'success');
            loadData();
            loadAuditLogs();
          } else {
            showModal('ข้อผิดพลาด', (res && res.message) || 'ไม่สามารถนำเข้าข้อมูลได้', 'error');
          }
        })
        .withFailureHandler(failHandler('นำเข้าข้อมูลไม่สำเร็จ'))
        .importBulkEstablishmentData(rowsToImport);
    } catch (err) {
      showModal('ข้อผิดพลาด', 'อ่านไฟล์ Excel ไม่สำเร็จ: ' + err.message, 'error');
    } finally {
      input.value = '';
    }
  };
  reader.readAsArrayBuffer(file);
}

  e.preventDefault();
  const orgName = document.getElementById('setOrgName').value.trim();
  const orgSub = document.getElementById('setOrgSub').value.trim();
  const newPwd = document.getElementById('setAdminPwd').value.trim();
  localStorage.setItem('ORG_SETTINGS', JSON.stringify({ orgName, orgSub }));
  if (newPwd) localStorage.setItem('ADMIN_PWD', newPwd);
  showToast('สำเร็จ', 'บันทึกการตั้งค่าเรียบร้อยแล้ว');
  setTimeout(() => switchMenu('dashboard'), 800);
}
</script>
